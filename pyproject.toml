[project]
name = "radar"
version = "0.1.0"
description = "Radar de vulnerabilidades: cruza inventario con NVD, KEV y EPSS, y un agente defensor redacta análisis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "turso-serverless",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "python-multipart",
    "pandas",
    "openpyxl",
    "anthropic",
]
agente = [
    "claude-agent-sdk",
    "anthropic",
]
mcp = [
    "mcp",
    "pandas",
    "openpyxl",
]

[project.scripts]
radar-mcp = "radar.mcp.servidor:principal"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Las pruebas que llaman a Claude no corren por defecto; `-m agente` reemplaza este filtro.
addopts = "-m 'not agente'"
markers = [
    "agente: pruebas que llaman a Claude (gastan créditos, no corren en CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
