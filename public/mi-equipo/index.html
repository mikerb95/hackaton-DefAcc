<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu equipo · Radar de vulnerabilidades</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mi-equipo/mi-equipo.css">
</head>
<body>
  <header class="cabecera">
    <span class="marca"><span class="marca-punto" aria-hidden="true"></span>Radar</span>
    <span class="cabecera-nota">Vista para quien usa este equipo</span>
  </header>

  <main class="hoja" id="hoja" aria-live="polite">
    <p class="cargando">Revisando tu equipo...</p>
  </main>

  <template id="t-error">
    <section class="tarjeta error">
      <h1 class="error-titulo"></h1>
      <p class="error-texto"></p>
    </section>
  </template>

  <footer class="pie" id="pie" hidden></footer>

  <script src="/mi-equipo/mi-equipo.js"></script>
</body>
</html>
